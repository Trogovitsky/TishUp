<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Прости меня 💔</title>
  <link rel="stylesheet" href="styles.css" />

  <!-- Автопрокрутка вниз -->
  <script>
    window.addEventListener('load', () => {
      setTimeout(() => {
        document.getElementById('slider').scrollIntoView({ behavior: 'smooth' });
      }, 8000);
    });
  </script>
</head>
<body>

  <!-- Фоновая музыка -->
  <audio autoplay loop>
    <source src="music.mp3" type="audio/mpeg" />
    Ваш браузер не поддерживает аудио.
  </audio>

  <!-- Первая секция -->
  <div class="section" id="main">
    <div class="heart"></div>
    <h1>Прости меня...</h1>

    <div class="text-container">
      <p class="typewriter">
        Я был(а) неправ(а). Мне очень жаль.  
        Ты — самая нежная, добрая, волшебная.  
        Прости мою ошибку...  
        Я хочу снова видеть твою улыбку 💗
      </p>
    </div>

    <a href="#slider">
      <button>💗 Обнять меня 💗</button>
    </a>
  </div>

  <!-- Слайдер -->
  <div class="slider fullscreen-slider" id="slider">
    <div class="slides">
      <img src="img1.jpg" alt="Фото 1" />
      <img src="img2.jpg" alt="Фото 2" />
      <img src="img3.jpg" alt="Фото 3" />
      <img src="img4.jpg" alt="Фото 4" />
      <img src="img5.jpg" alt="Фото 5" />
      <img src="img6.jpg" alt="Фото 6" />
      <img src="img7.jpg" alt="Фото 7" />
      <img src="img8.jpg" alt="Фото 8" />
      <img src="img9.jpg" alt="Фото 9" />
      <img src="img10.jpg" alt="Фото 10" />
    </div>
  </div>

</body>
</html>
