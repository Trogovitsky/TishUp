<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Прости меня 💔</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  
  <audio autoplay loop>
    <source src="music.mp3" type="audio/mpeg" />
  </audio>

  <div class="section" id="main">
    <div class="heart"></div>
    <h1 class="fade-in">Прости меня...</h1>
    <p class="typewriter">
      Я был неправ. Мне очень жаль.  
      Ты — самая нежная, добрая, лучшая.  
      Прости мою ошибку...  
      Я хочу снова видеть тебя 💗
    </p>
    <button onclick="location.reload()">💗💗</button>
  </div>

  <div class="section fade-scroll" id="slider-section">
    <h2>Мы</h2>
    <div class="slider">
      <div class="slides">
        <img src="img1.jpg" alt="Фото " />
        <img src="img2.jpg" alt="Фото 2" />
        <img src="img3.jpg" alt="Фото 3" />
        <img src="img4.jpg" alt="Фото 4" />
        <img src="img5.jpg" alt="Фото 5" />
        <img src="img6.jpg" alt="Фото 6" />
        <img src="img7.jpg" alt="Фото 7" />
        <img src="img8.jpg" alt="Фото 8" />
        <img src="img9.jpg" alt="Фото 9" />
        <img src="img10.jpg" alt="Фото 10" />
      </div>
    </div>
  </div>

</body>
</html>
